# docintel configuration example.
# Copy to ./docintel.yaml or ~/.config/docintel/config.yaml
# Env overrides: DOCINTEL_MODEL, DOCINTEL_BASE_URL, DOCINTEL_API_KEY_ENV,
#                DOCINTEL_EMBEDDING_MODEL

llm:
  provider: openai
  model: gpt-4o-mini          # required for LLM classification; no hardcoded default
  api_key_env: OPENAI_API_KEY # env var holding the API key
  # base_url: https://...     # optional: any OpenAI-compatible endpoint

classification:
  top_n: 5
  # categories:               # omit to use the built-in taxonomy
  #   - invoice
  #   - contract
  #   - report
  #   - resume
  #   - other
  # keywords:                 # extra phrases for the rule-based fallback
  #   invoice:
  #     - "due date"
  #     - "remittance"

extraction:
  # Per-category field schemas for `docintel extract`.
  # Built-in schemas exist for: invoice, receipt, purchase_order, quotation,
  # contract, resume (plus a generic fallback). Entries here REPLACE built-ins.
  # Field types: text | date | money | email | phone
  # schemas:
  #   invoice:
  #     - name: invoice_number
  #       type: text
  #       labels: ["invoice number", "invoice no", "invoice #"]
  #     - name: total_amount
  #       type: money
  #       labels: ["total", "amount due"]
  #     - name: due_date
  #       type: date
  #       labels: ["due date"]
  #   my_custom_doc:            # works for custom categories too
  #     - title                 # shorthand: type=text, no labels
  #     - name: reference
  #       type: text
  #       labels: ["ref no"]

search:
  # Semantic search + RAG settings (`docintel index` / `search` / `ask`).
  # embedding_model: text-embedding-3-small  # no hardcoded default; when unset,
  #                                          # a local lexical fallback is used (flagged)
  chunk_size: 1200          # chars per chunk
  overlap: 0.15             # fraction of chunk_size carried between chunks (0.0-0.5)
  top_k: 5                  # default number of search results / RAG sources
  index_path: .docintel/chroma  # ChromaDB persistent index location
