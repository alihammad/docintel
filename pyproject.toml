[project]
name = "docintel"
version = "0.1.0"
description = "CLI tool for analyzing documents (Markdown, PDF, DOCX): structure, statistics, and link checks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[project.scripts]
docintel = "docintel:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"
